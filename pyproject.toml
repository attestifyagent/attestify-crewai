[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attestify-crewai"
version = "0.2.0"
description = "CrewAI tool integration for Attestify — governed AI loop execution, receipts, audit trails, and Attestify Trust (no-wallet agent identity + signed evidence)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["attestify", "crewai", "ai-agents", "receipts", "governance", "x402", "trust", "agent-identity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "crewai>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
trust = ["cryptography>=41.0.0"]

[project.urls]
Homepage = "https://attestifyos.com/trust"
Repository = "https://github.com/attestifyagent/attestify-crewai"
Documentation = "https://attestifyos.com/docs#trust"
"Bug Tracker" = "https://github.com/attestifyagent/attestify-crewai/issues"

[tool.hatch.build.targets.wheel]
packages = ["attestify_crewai"]
