[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attestify-crewai"
version = "0.1.0"
description = "CrewAI tool integration for Attestify — governed AI loop execution, receipts, and audit trails"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["attestify", "crewai", "ai-agents", "receipts", "governance", "x402"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "crewai>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://attestifyos.com"
Repository = "https://github.com/attestifyagent/attestify-os"
Documentation = "https://attestifyos.com/docs"
"Bug Tracker" = "https://github.com/attestifyagent/attestify-os/issues"

[tool.hatch.build.targets.wheel]
packages = ["attestify_crewai"]
